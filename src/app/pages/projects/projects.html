<div class="md:px-40 flex flex-1 justify-center py-5" id="projects">
  <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
    <h2
      class="animate-pulse text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
    >
      Projects
    </h2>
    @for (item of projects(); track $index) {

      type="{{item.type}}"
      name="{{item.name}}"
      description="{{item.description}}"
      url="{{item.url}}"
    ></nsj-card>
    }
  </div>
</div>
